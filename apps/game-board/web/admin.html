<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Game Board — Headmaster Dashboard</title>
  <style>
    :root{--paper:#ead7aa;--light:#f7ecd0;--deep:#cfad70;--ink:#382719;--muted:#725d45;--red:#7b3f2b;--green:#49643d;--gold:#a47728;--shadow:rgba(57,36,17,.18)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Segoe UI",sans-serif}
    header{padding:24px 34px 18px;border-bottom:3px double var(--red);background:linear-gradient(#f4e5be,var(--paper));display:flex;justify-content:space-between;align-items:end;gap:20px}
    h1,h2,h3{font-family:Georgia,serif;margin:0} h1{font-size:32px} h2{font-size:21px;margin-bottom:14px} h3{font-size:16px;margin-bottom:8px}
    .subtitle,.muted{color:var(--muted)} .layout{display:grid;grid-template-columns:330px 1fr;gap:18px;padding:20px;min-height:calc(100vh - 100px)}
    .sidebar,.main{display:flex;flex-direction:column;gap:16px}.card{background:var(--light);border:1px solid var(--deep);box-shadow:0 3px 12px var(--shadow);padding:17px;border-radius:4px}
    label{display:block;font-weight:650;margin:9px 0 4px}input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--deep);background:#fffaf0;color:var(--ink);border-radius:3px}textarea{min-height:76px;resize:vertical}
    button{border:1px solid #68402c;background:var(--red);color:#fff8e7;padding:8px 12px;border-radius:3px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.08)}button.secondary{background:var(--deep);color:var(--ink)}button.good{background:var(--green)}button.warn{background:var(--gold)}button:disabled{opacity:.45;cursor:not-allowed}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:8px}.contact,.pending,.player{border-top:1px solid #dec693;padding:10px 0}.contact:first-child,.pending:first-child,.player:first-child{border-top:0}.small{font-size:12px}.pill{display:inline-block;border-radius:99px;padding:3px 8px;background:#dfc58f;font-size:11px;font-weight:800;text-transform:uppercase}.pill.good{background:#b8cfaa}.pill.fair{background:#ead18d}.pill.poor,.pill.revoked{background:#dfa89b}.pill.disconnected{background:#ccc}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.empty{padding:16px;text-align:center;color:var(--muted);font-style:italic;border:1px dashed var(--deep)}.error{color:#8a251c;font-weight:700}.success{color:#365d2c;font-weight:700}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #dec693}th{font-family:Georgia,serif}.hidden{display:none!important}
    @media(max-width:850px){.layout{grid-template-columns:1fr}header{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
<header><div><h1>Game Board</h1><div class="subtitle">Headmaster dashboard · private localhost view</div></div><div id="server-status" class="pill">Connecting</div></header>
<div class="layout">
  <aside class="sidebar">
    <section class="card"><h2>Private Address Book</h2>
      <form id="contact-form"><label for="contact-name">Player name</label><input id="contact-name" maxlength="100" required><label for="contact-email">Email address</label><input id="contact-email" type="email" maxlength="254" required><div class="row" style="margin-top:11px"><button>Add player</button></div></form>
      <div id="contacts" style="margin-top:12px"></div>
    </section>
    <section class="card"><h2>Connection Setup</h2>
      <form id="settings-form"><label for="wordpress_player_url">WordPress player page</label><input id="wordpress_player_url" placeholder="https://example.com/game-board/"><label for="allowed_origin">Allowed WordPress origin</label><input id="allowed_origin" placeholder="https://example.com"><label for="public_api_base">Public Game Board API</label><input id="public_api_base" placeholder="https://game.example.com"><label for="gmail_credentials_path">Google credential file</label><input id="gmail_credentials_path" value="credentials.json"><label for="gmail_sender">Sending Gmail address</label><input id="gmail_sender" type="email"><label for="timezone">Timezone</label><input id="timezone" value="America/Chicago"><div class="row" style="margin-top:11px"><button>Save settings</button><button type="button" id="gmail-connect" class="secondary">Connect Gmail</button></div></form>
      <div id="gmail-status" class="small muted" style="margin-top:9px"></div>
    </section>
  </aside>
  <main class="main">
    <section class="card" id="create-card"><h2>Create Game Session</h2>
      <form id="session-form"><div class="grid"><div><label for="session-title">Session title</label><input id="session-title" maxlength="120" required></div><div><label for="game-day">Game day</label><input id="game-day" type="date" required></div><div><label for="expiration-time">Expires at</label><input id="expiration-time" type="time" value="23:59" required></div></div><label>Roster</label><div id="roster" class="grid"></div><div class="row" style="margin-top:13px"><button>Create session</button></div></form>
    </section>
    <section class="card hidden" id="session-card"><div class="row spread"><div><h2 id="active-title"></h2><div id="session-meta" class="muted"></div></div><div class="row"><button id="pause-session" class="warn">Pause admissions</button><button id="end-session">End session</button></div></div>
      <div class="grid" style="margin-top:15px"><div><h3>Invitations</h3><div id="invitations"></div><div class="row" style="margin-top:10px"><button id="preview-invite" class="secondary">Preview email</button><button id="send-selected">Send selected</button><button id="send-all" class="secondary">Send all</button></div><textarea id="invitation-preview" class="hidden" readonly style="margin-top:10px;min-height:170px"></textarea></div><div><h3>Pending approval</h3><div id="pending"></div></div></div>
    </section>
    <section class="card hidden" id="monitor-card"><div class="row spread"><h2>Live Connections</h2><span class="small muted">Heartbeat every 5 seconds</span></div><div id="connections"></div></section>
    <section class="card hidden" id="announcement-card"><h2>Test Announcement</h2><div class="row"><input id="announcement" maxlength="1000" placeholder="Message approved players"><button id="send-announcement">Broadcast</button></div></section>
    <div id="notice"></div>
  </main>
</div>
<script>
const ADMIN_KEY="__ADMIN_KEY__";let state=null;
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function api(path,options={}){options.headers={"X-Admin-Key":ADMIN_KEY,"Content-Type":"application/json",...(options.headers||{})};const response=await fetch(path,options);const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||`Request failed (${response.status})`);return data}
function notice(message,error=false){$("notice").innerHTML=`<div class="card ${error?"error":"success"}">${esc(message)}</div>`;setTimeout(()=>$("notice").innerHTML="",5000)}
function render(next){state=next;$("server-status").textContent="Online";$("server-status").className="pill good";renderContacts();renderSettings();renderSession()}
function renderContacts(){const contacts=state.contacts||[];$("contacts").innerHTML=contacts.length?contacts.map(c=>`<div class="contact"><strong>${esc(c.name)}</strong><div class="small muted">${esc(c.email)}</div><button class="secondary small" onclick="deleteContact('${c.id}')">Remove</button></div>`).join(""):`<div class="empty">No players yet</div>`;$("roster").innerHTML=contacts.length?contacts.map(c=>`<label><input style="width:auto" type="checkbox" name="roster" value="${c.id}"> ${esc(c.name)}</label>`).join(""):`<div class="empty">Add contacts first</div>`}
function renderSettings(){for(const key of ["wordpress_player_url","allowed_origin","public_api_base","gmail_credentials_path","gmail_sender","timezone"]){if(document.activeElement!==$(key))$(key).value=state.settings[key]||""}const g=state.gmail||{};$("gmail-status").textContent=g.connected?`Gmail connected${g.sender?` as ${g.sender}`:""}`:(g.error||"Gmail is not connected")}
function renderSession(){const s=state.session;$("create-card").classList.toggle("hidden",!!s);for(const id of ["session-card","monitor-card","announcement-card"])$(id).classList.toggle("hidden",!s);if(!s)return;$("active-title").textContent=s.title;$("session-meta").textContent=`${s.status.toUpperCase()} · Expires ${new Date(s.expires_at).toLocaleString()}`;$("pause-session").textContent=s.status==="paused"?"Resume admissions":"Pause admissions";$("invitations").innerHTML=s.roster.map(p=>`<label class="player"><input style="width:auto" type="checkbox" name="invite" value="${p.contact_id}"> <strong>${esc(p.name)}</strong><br><span class="small muted">${esc(p.email)} · ${esc(p.invite_status)}</span> ${p.revoked?'<span class="pill revoked">revoked</span>':`<button class="secondary" onclick="revoke('${p.contact_id}')">Revoke</button>`}</label>`).join("");const pending=s.pending.filter(p=>p.status==="pending");$("pending").innerHTML=pending.length?pending.map(p=>`<div class="pending"><strong>${esc(p.name)}</strong><div class="small muted">${esc(p.client_ip)} · ${new Date(p.requested_at).toLocaleTimeString()}<br>${esc(p.user_agent)}</div><div class="row"><button class="good" onclick="admit('${p.id}','approve')">Approve</button><button onclick="admit('${p.id}','deny')">Deny</button></div></div>`).join(""):`<div class="empty">No one is waiting</div>`;const connections=state.connections||[];$("connections").innerHTML=connections.length?`<table><thead><tr><th>Player</th><th>Quality</th><th>Latency</th><th>Last activity</th><th></th></tr></thead><tbody>${connections.map(c=>`<tr><td>${esc(c.name)}</td><td><span class="pill ${c.quality}">${c.quality}</span></td><td>${c.latency_ms==null?"Measuring":`${c.latency_ms} ms`}<div class="small muted">${c.missed_heartbeats} missed</div></td><td>${new Date(c.last_activity).toLocaleTimeString()}</td><td><button onclick="revoke('${c.contact_id}')">Revoke</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">No approved players connected</div>`}
$("contact-form").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/contacts",{method:"POST",body:JSON.stringify({name:$("contact-name").value,email:$("contact-email").value})});e.target.reset();await refresh()}catch(x){notice(x.message,true)}};
window.deleteContact=async id=>{if(confirm("Remove this contact?")){try{await api(`/api/admin/contacts/${id}`,{method:"DELETE"});await refresh()}catch(x){notice(x.message,true)}}};
$("settings-form").onsubmit=async e=>{e.preventDefault();const body={};for(const key of ["wordpress_player_url","allowed_origin","public_api_base","gmail_credentials_path","gmail_sender","timezone"])body[key]=$(key).value;try{await api("/api/admin/settings",{method:"PUT",body:JSON.stringify(body)});notice("Settings saved. Restart the server after changing origins or ports.");await refresh()}catch(x){notice(x.message,true)}};
$("gmail-connect").onclick=async()=>{notice("Complete Google authorization in the browser window.");try{await api("/api/admin/gmail/authorize",{method:"POST"});notice("Gmail connected");await refresh()}catch(x){notice(x.message,true)}};
$("session-form").onsubmit=async e=>{e.preventDefault();const contact_ids=[...document.querySelectorAll('[name="roster"]:checked')].map(x=>x.value);try{await api("/api/admin/sessions",{method:"POST",body:JSON.stringify({title:$("session-title").value,game_day:$("game-day").value,expiration_time:$("expiration-time").value,contact_ids})});await refresh()}catch(x){notice(x.message,true)}};
async function sendInvites(ids){try{const result=await api("/api/admin/invitations/send",{method:"POST",body:JSON.stringify({contact_ids:ids})});const ok=result.results.filter(x=>x.success).length;const failures=result.results.filter(x=>!x.success);notice(`${ok} invitation(s) sent${failures.length?`; ${failures.length} failed: ${failures.map(x=>x.error).join(", ")}`:""}`,!!failures.length);await refresh()}catch(x){notice(x.message,true)}}
$("preview-invite").onclick=()=>{const selected=document.querySelector('[name="invite"]:checked');const player=state.session.roster.find(x=>x.contact_id===(selected?.value||state.session.roster[0]?.contact_id));if(!player)return;const link=`${state.settings.wordpress_player_url||"[WordPress player page]"}#invite=[private token]`;const text=`To: ${player.email}\nSubject: Game Board invitation: ${state.session.title}\n\nHello ${player.name},\n\nUse this private link to request admission to ${state.session.title}:\n\n${link}\n\nThe invitation expires at ${new Date(state.session.expires_at).toLocaleString()}. The headmaster must approve every connection.`;$("invitation-preview").value=text;$("invitation-preview").classList.remove("hidden")};
$("send-selected").onclick=()=>sendInvites([...document.querySelectorAll('[name="invite"]:checked')].map(x=>x.value));$("send-all").onclick=()=>sendInvites((state.session?.roster||[]).filter(x=>!x.revoked).map(x=>x.contact_id));
window.admit=async(id,action)=>{try{await api(`/api/admin/admissions/${id}/${action}`,{method:"POST"});await refresh()}catch(x){notice(x.message,true)}};window.revoke=async id=>{if(confirm("Revoke this player's invitation and disconnect them?")){try{await api(`/api/admin/players/${id}/revoke`,{method:"POST"});await refresh()}catch(x){notice(x.message,true)}}};
$("pause-session").onclick=async()=>{const action=state.session.status==="paused"?"resume":"pause";try{await api(`/api/admin/session/${action}`,{method:"POST"});await refresh()}catch(x){notice(x.message,true)}};$("end-session").onclick=async()=>{if(confirm("End this session and disconnect everyone?")){try{await api("/api/admin/session/end",{method:"POST"});await refresh()}catch(x){notice(x.message,true)}}};
$("send-announcement").onclick=async()=>{try{await api("/api/admin/announcements",{method:"POST",body:JSON.stringify({message:$("announcement").value})});$("announcement").value="";notice("Announcement sent")}catch(x){notice(x.message,true)}};
async function refresh(){try{render(await api("/api/admin/state"))}catch(x){$("server-status").textContent="Offline";$("server-status").className="pill poor";notice(x.message,true)}}
function connectUpdates(){const ws=new WebSocket(`ws://${location.host}/ws/admin?key=${encodeURIComponent(ADMIN_KEY)}`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="state")render(m.data)};ws.onclose=()=>setTimeout(connectUpdates,2000)}
$("game-day").value=new Date().toLocaleDateString("en-CA");refresh();connectUpdates();
</script>
</body></html>
