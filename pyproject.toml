[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headmasters-scroll"
version = "0.2.0"
description = "Local multi-app foundation for Charms Check"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11,<13",
]

[project.optional-dependencies]
game-board = [
  "fastapi>=0.116,<1",
  "google-api-python-client>=2.177,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx2>=2,<3",
  "keyring>=25,<26",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
headmasters-scroll = "headmasters_scroll.launcher:main"
game-board-server = "headmasters_scroll.game_board.server:main"

[tool.setuptools.packages.find]
include = ["headmasters_scroll*"]
